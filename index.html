<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#171a28"><title>墨靈錄｜手寫引妖</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#f5eede;background:#121521}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#31364d,#121521 65%);min-height:100vh}.wrap{max-width:560px;margin:auto;padding:20px 16px 80px}header{text-align:center;padding:22px 0 12px}h1{font-family:serif;letter-spacing:.25em;margin:0;font-size:34px;color:#ead4a0}header p,.muted{color:#b9b7bd;font-size:13px}nav{display:flex;gap:8px;margin:18px 0}.tab{flex:1;background:#272b3a;border:1px solid #50505b;color:#e9e0cd;padding:12px 8px;border-radius:12px;font-weight:700}.tab.active{background:#aa8351;color:#171521;border-color:#e0bd83}.panel{border:1px solid #6c5b4b;border-radius:18px;background:linear-gradient(155deg,#292b38,#1b1f2c);padding:18px;box-shadow:0 12px 35px #080a1266}h2{font-size:19px;margin:0 0 14px;color:#ebd3a5}.info{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:#dfcda8;margin-bottom:15px}.selectrow{display:flex;align-items:center;gap:10px;margin:14px 0}select{flex:1;min-width:0;padding:11px;background:#151925;border:1px solid #776c5e;border-radius:10px;color:#fff;font-size:16px}.paper{position:relative;max-width:420px;margin:auto;background:#e9ddc3;border:7px solid #bda477;border-radius:12px;box-shadow:inset 0 0 20px #ad926d66;aspect-ratio:1/1;touch-action:none;overflow:hidden}canvas{width:100%;height:100%;display:block;touch-action:none}.guide{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;color:#a99a8266;font-size:125px;font-family:serif}.hint{font-size:12px;color:#bdb3a4;text-align:center;margin:11px 0}.actions{display:flex;gap:9px;margin-top:14px}button{cursor:pointer}.action{flex:1;border:0;border-radius:11px;padding:13px 10px;font-weight:800;font-size:15px}.primary{background:linear-gradient(#e9c48b,#bb8a4e);color:#221b19}.secondary{background:#414351;color:#fff}.result{margin-top:17px;padding:17px;border:1px solid #ae8954;border-radius:14px;background:#1b1d2a;text-align:center}.creature{font-size:66px;line-height:1.3}.score{font-size:26px;font-weight:900;color:#f1d09a}.pill{display:inline-block;background:#4a3b38;border:1px solid #a17b50;color:#f3d8ad;padding:5px 9px;border-radius:30px;font-size:12px;margin:4px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.monster{background:#222634;border:1px solid #605a55;border-radius:13px;padding:14px;text-align:center}.monster .creature{font-size:49px}.monster strong{display:block;color:#f0d6a7}.monster small{color:#c4bcc0}.empty{text-align:center;padding:40px 15px;color:#c5bac0}.notice{font-size:12px;line-height:1.7;color:#b7b5bd;margin-top:17px}footer{text-align:center;font-size:11px;color:#8e909e;margin-top:22px}[hidden]{display:none!important}
</style>
</head>
<body><div class="wrap"><header><h1>墨靈錄</h1><p>一筆落墨 · 萬靈應召　｜　開發測試版 0.2</p></header>
<nav><button class="tab active" id="tabSummon">畫符引妖</button><button class="tab" id="tabBook">妖靈圖鑑 <span id="count">0</span></button></nav>
<section class="panel" id="summon"><h2>靈池 · 初試符術</h2><div class="info"><span>符師：初入墨道</span><span>今日測試：不限次數</span></div>
<div class="selectrow"><label for="glyph">本次符字</label><select id="glyph"><option value="火">火 · 火系</option><option value="水">水 · 水系</option><option value="木">木 · 木系</option><option value="金">金 · 金系</option><option value="土">土 · 土系</option><option value="霜">霜 · 金系</option><option value="雷">雷 · 木系</option><option value="月">月 · 水系</option></select></div>
<div class="paper" id="paper"><div class="guide" id="guide">火</div><canvas id="canvas" aria-label="手寫畫符區"></canvas></div>
<p class="hint">用手指在符紙上書寫。選字僅用於測試，尚未具備字形辨識。</p>
<div class="actions"><button class="action secondary" id="clear">清除重寫</button><button class="action primary" id="cast">引妖召喚</button></div><div id="result" class="result" hidden></div>
<p class="notice">目前的符力依筆跡長度、筆畫數與覆蓋範圍計算示範分數，並非真正的中文字正確率。妖靈資料為原創測試設定；資料儲存在此瀏覽器，清除網站資料可能導致圖鑑消失。</p></section>
<section class="panel" id="book" hidden><h2>我的妖靈圖鑑</h2><div class="grid" id="collection"></div><button class="action secondary" id="reset" style="width:100%;margin-top:16px">清空本機測試存檔</button></section><footer>墨靈錄 · 原創遊戲開發原型 · 無需登入</footer></div>
<script>
(()=>{'use strict';
const defs={火:{name:'燼羽雀',emoji:'🐦',element:'火'},水:{name:'漣波靈',emoji:'🪼',element:'水'},木:{name:'青藤鹿',emoji:'🦌',element:'木'},金:{name:'玄鐵獸',emoji:'🐺',element:'金'},土:{name:'岩甲龜',emoji:'🐢',element:'土'},霜:{name:'霜尾靈',emoji:'🦊',element:'金'},雷:{name:'鳴雷貂',emoji:'🐿️',element:'木'},月:{name:'月影兔',emoji:'🐇',element:'水'}};
const key='ink-spirit-collection-v02';let saved=[];try{const v=JSON.parse(localStorage.getItem(key)||'[]');saved=Array.isArray(v)?v:[]}catch{};
const $=id=>document.getElementById(id),canvas=$('canvas'),ctx=canvas.getContext('2d');let drawing=false,strokes=0,distance=0,points=[],last=null;
function resize(){const rect=canvas.getBoundingClientRect(),ratio=Math.min(window.devicePixelRatio||1,3);canvas.width=Math.round(rect.width*ratio);canvas.height=Math.round(rect.height*ratio);ctx.setTransform(ratio,0,0,ratio,0,0);ctx.strokeStyle='#29232a';ctx.lineWidth=6;ctx.lineCap='round';ctx.lineJoin='round';resetInk()}
function resetInk(){ctx.clearRect(0,0,canvas.width,canvas.height);drawing=false;strokes=0;distance=0;points=[];last=null;$('result').hidden=true}
function point(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();canvas.setPointerCapture(e.pointerId);drawing=true;strokes++;last=point(e);points.push(last);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(last.x+.1,last.y+.1);ctx.stroke()});
canvas.addEventListener('pointermove',e=>{if(!drawing)return;e.preventDefault();const p=point(e);distance+=Math.hypot(p.x-last.x,p.y-last.y);points.push(p);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p});
for(const ev of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(ev,()=>{drawing=false;last=null});
$('clear').onclick=resetInk;$('glyph').onchange=()=>{$('guide').textContent=$('glyph').value;resetInk()};
function score(){const w=canvas.getBoundingClientRect().width;const xs=points.map(p=>p.x),ys=points.map(p=>p.y);const area=((Math.max(...xs)-Math.min(...xs))*(Math.max(...ys)-Math.min(...ys)))/(w*w);return Math.max(1,Math.min(100,Math.round(25+Math.min(35,distance/w*12)+Math.min(20,strokes*4)+Math.min(20,area*75))))}
function rarity(n){return n>=95?'稀有':n>=75?'優良':'普通'}
$('cast').onclick=()=>{if(points.length<3||distance<25){alert('請先在符紙上寫下符字，再進行召喚。');return}const glyph=$('glyph').value,def=defs[glyph],s=score(),r=rarity(s),power=Math.round(30+s*.8),id=(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random());const monster={id,glyph,name:def.name,emoji:def.emoji,element:def.element,score:s,rarity:r,power,created:new Date().toISOString()};saved.unshift(monster);try{localStorage.setItem(key,JSON.stringify(saved))}catch{alert('瀏覽器無法保存資料，這次召喚可能無法保留。')}const el=$('result');el.hidden=false;el.replaceChildren();const icon=document.createElement('div');icon.className='creature';icon.textContent=monster.emoji;const title=document.createElement('h2');title.textContent='召喚成功 · '+monster.name;const desc=document.createElement('div');desc.textContent='符力 '+s+' / 100';desc.className='score';const detail=document.createElement('p');detail.textContent='五行：'+monster.element+'　｜　戰力：'+power;const pill=document.createElement('span');pill.className='pill';pill.textContent=r;el.append(icon,title,desc,detail,pill);renderBook()};
function renderBook(){const root=$('collection');root.replaceChildren();$('count').textContent=saved.length;if(!saved.length){const el=document.createElement('div');el.className='empty';el.style.gridColumn='1/-1';el.textContent='還沒有妖靈，先去畫符召喚吧！';root.append(el);return}saved.forEach(m=>{const card=document.createElement('div');card.className='monster';const icon=document.createElement('div');icon.className='creature';icon.textContent=m.emoji;const name=document.createElement('strong');name.textContent=m.name;const desc=document.createElement('small');desc.textContent=m.glyph+' · '+m.element+' · '+m.rarity+'\n符力 '+m.score+' · 戰力 '+m.power;desc.style.whiteSpace='pre-line';card.append(icon,name,desc);root.append(card)})}
function tab(which){const isBook=which==='book';$('summon').hidden=isBook;$('book').hidden=!isBook;$('tabBook').classList.toggle('active',isBook);$('tabSummon').classList.toggle('active',!isBook);if(!isBook)requestAnimationFrame(resize);else renderBook()}
$('tabBook').onclick=()=>tab('book');$('tabSummon').onclick=()=>tab('summon');$('reset').onclick=()=>{if(confirm('確定清空此瀏覽器的所有測試妖靈嗎？')){saved=[];localStorage.removeItem(key);renderBook()}};
window.addEventListener('resize',()=>{if(!$('summon').hidden)resize()});requestAnimationFrame(resize);renderBook();
})();
</script></body></html>
